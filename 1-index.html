<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Naruto Bros - Konoha Platformer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="touch">
    <div class="pad left">
      <div class="btn" id="t-left">&#9664;</div>
      <div class="btn" id="t-right">&#9654;</div>
    </div>
    <div class="pad right">
      <div class="btn b" id="t-throw">B</div>
      <div class="btn a" id="t-jump">A</div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
